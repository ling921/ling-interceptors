name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  release:
    types: [published]

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet

      - name: Pack local packages for integration samples
        run: |
          mkdir -p .artifacts/packages
          for project in \
            src/Ling.Interceptors/Ling.Interceptors.csproj \
            src/Ling.Interceptors.Logging/Ling.Interceptors.Logging.csproj \
            src/Ling.Interceptors.Console/Ling.Interceptors.Console.csproj \
            src/Ling.Interceptors.OpenTelemetry/Ling.Interceptors.OpenTelemetry.csproj
          do
            dotnet pack "$project" --configuration Release --output .artifacts/packages
          done
          dotnet restore Ling.Interceptors.slnx

      - name: Build
        run: dotnet build Ling.Interceptors.slnx --configuration Release --no-restore

      - name: Test .NET 9 and .NET 10
        run: dotnet test Ling.Interceptors.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: |
          mkdir -p artifacts/packages
          for project in \
            src/Ling.Interceptors/Ling.Interceptors.csproj \
            src/Ling.Interceptors.Logging/Ling.Interceptors.Logging.csproj \
            src/Ling.Interceptors.Console/Ling.Interceptors.Console.csproj \
            src/Ling.Interceptors.OpenTelemetry/Ling.Interceptors.OpenTelemetry.csproj
          do
            dotnet pack "$project" --configuration Release --no-build --output artifacts/packages
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ling.Interceptors-nupkg
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet

      - name: Pack packages
        run: |
          mkdir -p artifacts/packages
          for project in \
            src/Ling.Interceptors/Ling.Interceptors.csproj \
            src/Ling.Interceptors.Logging/Ling.Interceptors.Logging.csproj \
            src/Ling.Interceptors.Console/Ling.Interceptors.Console.csproj \
            src/Ling.Interceptors.OpenTelemetry/Ling.Interceptors.OpenTelemetry.csproj
          do
            dotnet pack "$project" --configuration Release --output artifacts/packages
          done

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ling921

      - name: Publish packages
        run: |
          dotnet nuget push artifacts/packages/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push artifacts/packages/*.snupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
