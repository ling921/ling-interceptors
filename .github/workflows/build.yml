name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet

      - name: Restore and pack the local package for the integration sample
        run: |
          dotnet restore src/Ling.Interceptors/Ling.Interceptors.csproj
          dotnet pack src/Ling.Interceptors/Ling.Interceptors.csproj --configuration Release --no-restore --output .artifacts/packages
          dotnet restore Ling.Interceptors.slnx

      - name: Build
        run: dotnet build Ling.Interceptors.slnx --configuration Release --no-restore

      - name: Test .NET 9 and .NET 10
        run: dotnet test Ling.Interceptors.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/Ling.Interceptors/Ling.Interceptors.csproj --configuration Release --no-build --output artifacts/packages

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ling.Interceptors-nupkg
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet

      - name: Pack package
        run: dotnet pack src/Ling.Interceptors/Ling.Interceptors.csproj --configuration Release --output artifacts/packages

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ling921

      - name: Publish package
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
