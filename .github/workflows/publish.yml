name: Publish NuGet package

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet

      - name: Test and pack
        run: |
          dotnet restore src/Ling.Interceptors/Ling.Interceptors.csproj
          dotnet pack src/Ling.Interceptors/Ling.Interceptors.csproj --configuration Release --no-restore --output .artifacts/packages
          dotnet test Ling.Interceptors.slnx --configuration Release
          dotnet pack src/Ling.Interceptors/Ling.Interceptors.csproj --configuration Release --no-build --output artifacts/packages

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ling921

      - name: Publish package
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
